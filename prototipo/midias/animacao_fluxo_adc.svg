<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <rect width="760" height="180" rx="14" fill="#0f172a"/>
  <text x="380" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#e2e8f0">Fluxo Animado da Conversão Analógico → Digital → Analógico</text>

  <!-- Track lines -->
  <line x1="90" y1="95" x2="670" y2="95" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Moving analog pulse -->
  <circle r="7" cy="95" fill="#38bdf8">
    <animate attributeName="cx" values="90;280;280" keyTimes="0;0.33;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.32;0.34" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- Moving digital binary packet -->
  <g>
    <rect x="-24" y="83" width="48" height="24" rx="5" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="0" y="99" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">10110</text>
    <animateTransform attributeName="transform" type="translate" values="280,0;280,0;480,0;480,0" keyTimes="0;0.33;0.66;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.35;0.65;0.68" dur="3.2s" repeatCount="indefinite"/>
  </g>
  <!-- Moving reconstructed output pulse -->
  <circle r="7" cy="95" fill="#34d399">
    <animate attributeName="cx" values="480;480;670" keyTimes="0;0.66;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.68;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Nodes -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="64" width="120" height="62" rx="10" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="92" font-size="13" font-weight="700" fill="#fff">Microfone</text>
    <text x="90" y="110" font-size="10.5" fill="#7dd3fc">Sinal Contínuo</text>

    <rect x="220" y="64" width="120" height="62" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <text x="280" y="92" font-size="13" font-weight="700" fill="#fff">ADC</text>
    <text x="280" y="110" font-size="10.5" fill="#a5f3fc">Amostra + Bits</text>

    <rect x="420" y="64" width="120" height="62" rx="10" fill="#3b0764" stroke="#a78bfa" stroke-width="2"/>
    <text x="480" y="92" font-size="13" font-weight="700" fill="#fff">DAC</text>
    <text x="480" y="110" font-size="10.5" fill="#ddd6fe">Reconstrução</text>

    <rect x="610" y="64" width="120" height="62" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="670" y="92" font-size="13" font-weight="700" fill="#fff">Alto-falante</text>
    <text x="670" y="110" font-size="10.5" fill="#6ee7b7">Onda Sonora</text>
  </g>
  <text x="380" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#94a3b8">Animação vetorial SVG original (SMIL) — sem perda de qualidade em qualquer zoom</text>
</svg>