<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cardCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="960" height="320" rx="16" fill="url(#bgGrad)"/>
  <text x="480" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#f8fafc">Cadeia Completa do Áudio Digital em Sistemas Multimídia</text>
  <text x="480" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#94a3b8">Da vibração acústica analógica ao armazenamento digital e reconstrução sonora</text>

  <!-- Stage 1 -->
  <rect x="24" y="95" width="150" height="145" rx="12" fill="url(#cardBlue)" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 48 150 Q 62 115, 76 150 T 104 150 T 132 150 T 152 150" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <text x="99" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">1. Som Analógico</text>
  <text x="99" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cbd5e1">Variação contínua</text>
  <text x="99" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cbd5e1">de pressão no ar</text>

  <line x1="174" y1="168" x2="206" y2="168" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="210" y="95" width="150" height="145" rx="12" fill="url(#cardBlue)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="273" y="116" width="24" height="36" rx="12" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 263 142 A 22 22 0 0 0 307 142" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="285" y1="164" x2="285" y2="174" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="272" y1="174" x2="298" y2="174" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="285" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">2. Transdutor</text>
  <text x="285" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cbd5e1">Microfone converte</text>
  <text x="285" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cbd5e1">som em sinal elétrico</text>

  <line x1="360" y1="168" x2="392" y2="168" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="396" y="95" width="170" height="145" rx="12" fill="url(#cardCyan)" stroke="#22d3ee" stroke-width="2"/>
  <g stroke="#67e8f9" stroke-width="2">
    <line x1="425" y1="164" x2="425" y2="142"/>
    <line x1="443" y1="164" x2="443" y2="122"/>
    <line x1="461" y1="164" x2="461" y2="132"/>
    <line x1="479" y1="164" x2="479" y2="116"/>
    <line x1="497" y1="164" x2="497" y2="148"/>
    <line x1="515" y1="164" x2="515" y2="128"/>
    <line x1="533" y1="164" x2="533" y2="150"/>
  </g>
  <g fill="#facc15">
    <circle cx="425" cy="142" r="3.5"/><circle cx="443" cy="122" r="3.5"/><circle cx="461" cy="132" r="3.5"/>
    <circle cx="479" cy="116" r="3.5"/><circle cx="497" cy="148" r="3.5"/><circle cx="515" cy="128" r="3.5"/><circle cx="533" cy="150" r="3.5"/>
  </g>
  <text x="481" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">3. Conversor ADC</text>
  <text x="481" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e0f2fe">Amostragem (Hz) +</text>
  <text x="481" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e0f2fe">Quantização (Bits)</text>

  <line x1="566" y1="168" x2="598" y2="168" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="602" y="95" width="150" height="145" rx="12" fill="url(#cardPurple)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="677" y="136" font-family="Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#ddd6fe">01011001</text>
  <text x="677" y="158" font-family="Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#c4b5fd">10100110</text>
  <text x="677" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">4. Áudio Digital</text>
  <text x="677" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ede9fe">PCM / WAV / FLAC</text>
  <text x="677" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ede9fe">ou MP3 / AAC / OGG</text>

  <line x1="752" y1="168" x2="784" y2="168" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <rect x="788" y="95" width="148" height="145" rx="12" fill="url(#cardBlue)" stroke="#34d399" stroke-width="1.5"/>
  <polygon points="834,138 852,138 868,122 868,170 852,154 834,154" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 878 134 Q 888 146, 878 158" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 886 126 Q 900 146, 886 166" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <text x="862" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">5. DAC e Saída</text>
  <text x="862" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d1fae5">Reconstrói a onda</text>
  <text x="862" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d1fae5">no alto-falante/fone</text>

  <!-- Domain labels -->
  <rect x="24" y="260" width="336" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="4 3"/>
  <text x="192" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#7dd3fc">DOMÍNIO ANALÓGICO (Contínuo)</text>

  <rect x="396" y="260" width="356" height="34" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-dasharray="4 3"/>
  <text x="574" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#c4b5fd">DOMÍNIO DIGITAL (Discreto / Binário)</text>

  <rect x="788" y="260" width="148" height="34" rx="8" fill="#1e293b" stroke="#34d399" stroke-dasharray="4 3"/>
  <text x="862" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#6ee7b7">ANALÓGICO</text>
</svg>